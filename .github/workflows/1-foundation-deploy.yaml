name: 1️⃣ Foundation Deployment (Networking + Storage)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-terraform-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Create S3 Backend & DynamoDB Lock Table (if not exists)
        run: |
          BUCKET="your-org-tfstate"
          TABLE="terraform-locks"
          REGION="us-east-1"
          
          # Create S3 bucket for state
          if ! aws s3 ls "s3://$BUCKET" 2>/dev/null; then
            echo "Creating S3 bucket for Terraform state..."
            aws s3api create-bucket \
              --bucket $BUCKET \
              --region $REGION \
              --create-bucket-configuration LocationConstraint=$REGION 2>/dev/null || true
            
            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket $BUCKET \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket $BUCKET \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }]
              }'
          fi
          
          # Create DynamoDB table for locks
          if ! aws dynamodb describe-table --table-name $TABLE --region $REGION 2>/dev/null; then
            echo "Creating DynamoDB table for state locking..."
            aws dynamodb create-table \
              --table-name $TABLE \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region $REGION 2>/dev/null || true
          fi

      - name: Terraform Init (Foundation)
        working-directory: infra/_foundation
        run: terraform init

      - name: Terraform Validate
        working-directory: infra/_foundation
        run: terraform validate

      - name: Terraform Format Check
        working-directory: infra/_foundation
        run: terraform fmt -check -recursive

      - name: Terraform Plan
        working-directory: infra/_foundation
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfplan

      - name: Display Terraform Plan
        working-directory: infra/_foundation
        run: terraform show -no-color tfplan

      - name: Approve & Apply
        working-directory: infra/_foundation
        run: |
          echo "🚀 Deploying foundation layer..."
          terraform apply -auto-approve tfplan

      - name: Export Foundation Outputs
        working-directory: infra/_foundation
        run: |
          echo "✅ Foundation deployed successfully!"
          echo ""
          echo "📋 Outputs:"
          terraform output -json | jq .

      - name: Create Deployment Summary
        run: |
          cat > /tmp/deployment-summary.md << EOF
          # ✅ Foundation Deployment Complete
          
          **Environment:** ${{ github.event.inputs.environment }}
          **Timestamp:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          
          ## Resources Created:
          - ✅ VPC (10.0.0.0/16)
          - ✅ Public Subnets (2x)
          - ✅ Private Subnets (2x)
          - ✅ NAT Gateways (2x)
          - ✅ Application Load Balancer
          - ✅ WAF (Log4j protection)
          - ✅ RDS MySQL (Multi-AZ)
          - ✅ IAM Roles & Policies
          - ✅ VPC Endpoints
          - ✅ VPC Flow Logs
          
          ## Next Step:
          Trigger workflow **2-compute-bootstrap** to deploy EC2 instances.
          EOF
          cat /tmp/deployment-summary.md
